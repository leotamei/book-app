<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer App</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Simple Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">📚 Book Explorer</span>
      <div>
        <!-- SPA Tab Navigation Buttons -->
        <button id="nav-search-btn" class="btn btn-outline-light btn-sm me-2 active">Search</button>
        <button id="nav-favs-btn" class="btn btn-outline-light btn-sm me-2">Favorites (<span id="fav-count">0</span>)</button>
        <button id="nav-reviews-btn" class="btn btn-outline-light btn-sm">Reviews</button>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- Container for Error / Success Messages -->
    <div id="alert-message"></div>

    <!-- VIEW 1: SEARCH PAGE -->
    <div id="search-page">
      <div class="card p-3 mb-4 shadow-sm">
        <!-- Event Listener 1: 'submit' on search form -->
        <form id="search-form" class="row g-2">
          <div class="col-8">
            <input type="text" id="search-input" class="form-control" placeholder="Search for books (e.g. Harry Potter)..." required>
          </div>
          <div class="col-4">
            <button type="submit" class="btn btn-primary w-100">Search Books</button>
          </div>
        </form>
      </div>

      <!-- Filter Controls -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Search Results</h3>
        <!-- Event Listener 2: 'change' on sort select -->
        <select id="sort-select" class="form-select w-auto">
          <option value="default">Sort by Default</option>
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
      </div>

      <!-- Loading Indicator -->
      <p id="loading-text" class="text-center text-primary d-none">Loading books from API...</p>

      <!-- Book Display Grid -->
      <div id="book-list" class="row row-cols-1 row-cols-md-3 g-3"></div>
    </div>

    <!-- VIEW 2: FAVORITES PAGE -->
    <div id="favorites-page" class="d-none">
      <h3 class="mb-3">My Saved Favorites</h3>
      <div id="favorites-list" class="row row-cols-1 row-cols-md-3 g-3"></div>
    </div>

    <!-- VIEW 3: COMMUNITY REVIEWS PAGE -->
    <div id="reviews-page" class="d-none">
      <h3 class="mb-3">Community Reviews</h3>
      
      <!-- Review Form -->
      <div class="card p-3 mb-4 shadow-sm bg-light">
        <h5>Add Your Review</h5>
        <!-- Event Listener 1: 'submit' on review form (Triggers POST) -->
        <form id="review-form">
          <div class="mb-2">
            <input type="text" id="review-title" class="form-control" placeholder="Book Title" required>
          </div>
          <div class="mb-2">
            <input type="text" id="review-name" class="form-control" placeholder="Your Name" required>
          </div>
          <div class="mb-2">
            <select id="review-rating" class="form-select" required>
              <option value="5">5 Stars</option>
              <option value="4">4 Stars</option>
              <option value="3">3 Stars</option>
              <option value="2">2 Stars</option>
              <option value="1">1 Star</option>
            </select>
          </div>
          <div class="mb-2">
            <textarea id="review-body" class="form-control" rows="3" placeholder="Write your review here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-success">Submit Review (POST)</button>
        </form>
      </div>

      <!-- List of Reviews -->
      <div id="reviews-list" class="row row-cols-1 row-cols-md-2 g-3"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
